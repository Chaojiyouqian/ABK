[package]
name = "abk-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
adw = { package = "libadwaita", version = "0.7" }
gtk = { package = "gtk4", version = "0.9" }
gtk3 = { package = "gtk", version = "0.18" }
glib = "0.20"
gdk-pixbuf = "0.20"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
urlencoding = "2.1"
webkit2gtk = { version = "2.0.2", features = ["v2_22"] }
